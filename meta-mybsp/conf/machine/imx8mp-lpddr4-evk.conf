#@TYPE: Machine
#@NAME: NXP i.MX8MP EVK (myboat profile)
#@DESCRIPTION: Machine configuration for the i.MX 8M Plus Evaluation Kit

# Pull in the NXP BSP's stock EVK machine, then apply the boring-stuff policy.
require conf/machine/include/imx8mp-lpddr4-evk.inc

MACHINEOVERRIDES =. "myboat:"

# ---------- boring stuff §6: real-time without heroics ----------
# the platform.s pattern: isolate one core for the control/audio app,
# run IRQs threaded so priorities work.
KERNEL_BOOTARGS:append = " isolcpus=3 threadirqs"

# ---------- boring stuff §4: A/B boot ----------
# The bootloader reads boot_slot (a/b) and boots root_a or root_b by partlabel.
KERNEL_BOOTARGS:append = " root=PARTUUID=${root_partuuid} boat.boot_slot=${boot_slot}"

# Writable data partition mounted at /data; /reference layout:
#   /data/userdata/<service>  via StateDirectory= bind mounts

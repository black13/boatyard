# mydistro — the distro layer ("mydistro" equivalent)
# The OS is frozen; apps float on top.

DISTRO_NAME = "MyBoat Distro"
DISTRO_VERSION = "4.0.29"
DISTRO_CODENAME = "kirkstone"
SDK_VENDOR = "-myboat"

MAINTAINER = "you@example.com"

# Base: poky (the default) — then layer the reference policy:

# read-only rootfs is enabled per-image (local.conf), not globally.
INIT_MANAGER = "systemd"

# the platform pattern: keep the OS conservative.
PREFERRED_VERSION_linux-imx = "5.15%"

# ---------- boring stuff §8: the eng/rel switch ----------
# One codebase, two personalities. Distro feature toggles the behavior.
DISTRO_FEATURES:append = " boatplatform"
DISTRO_FEATURES:append = "${@ ' engmode' if d.getVar('BUILDTYPE') == 'eng' else ' relmode'}"

# A single knob that flows into recipes:
#   ${@bb.utils.contains('DISTRO_FEATURES','engmode','-DENG','',d)}
#   ${@bb.utils.contains('DISTRO_FEATURES','relmode','-DREL','',d)}

# Version policy: distro version is the OS version, NOT the product version.
VERSION_ID = "${DISTRO_VERSION}"
